# VideoAgent 配置文件

whisper:
  # 模型路径 (留空则使用默认缓存路径)
  # 注意: D 盘复制已完成
  model_path: "D:\\AI\\HFCache\\whisper\\large-v3.pt"
  # 模型名称 (如果 model_path 为空)
  model_name: "large-v3"
  # 设备: auto / cuda / cpu
  device: "auto"
  # 是否使用 FP16 (CUDA 时生效)
  fp16: true
  # 默认语言
  default_language: "zh"

  # ─── 分段转录配置（长视频 > 阈值时自动启用） ───
  segment_transcribe:
    # 分段阈值（分钟），超过此时长自动启用分段转录
    threshold_minutes: 30
    # 每个 chunk 的时长（秒），默认 15 分钟
    chunk_duration: 900
    # 相邻 chunk 重叠时长（秒），覆盖 3-5 个 Whisper segment
    overlap: 10
    # Segment 去重相似度阈值（0.0-1.0），超过则判定为重复
    similarity_threshold: 0.8
    # 是否进行响度归一化（提升噪声视频质量，但增加处理时间）
    normalize_loudness: false
    # Whisper beam search 大小（提升边界准确率）
    beam_size: 5
    # 是否使用 temperature fallback（首次 0，失败时 0.5）
    temperature_fallback: true

llm:
  # LLM 提供商: llama_cpp / openai / ollama
  provider: "openai"
  # 模型名称
  model: "Qwen3.6-27B-Q4_K_M.gguf"
  # API 端点 (llama.cpp 默认 8080)
  endpoint: "http://localhost:8080/v1"
  # API key (llama.cpp 通常不需要，留空即可)
  api_key: ""
  # 超时时间 (秒)
  timeout: 1800
  # 温度 (0-1，越低越确定)
  temperature: 0.3
  # 最大输出 token 数 (LLM 响应长度)
  # 长视频分析建议 8192~16384
  max_tokens: 16384
  # LLM 上下文窗口大小 (仅供参考，实际由 llama.cpp --ctx-size 控制)
  # 100k 上下文建议 --ctx-size 131072
  context_size: 131072

ffmpeg:
  # ffmpeg 可执行文件路径
  path: "D:\\AI\\AudioAI\\FFmpeg\\bin\\ffmpeg.exe"
  # ffprobe 路径 (通常与 ffmpeg 同目录)
  probe_path: "D:\\AI\\AudioAI\\FFmpeg\\bin\\ffprobe.exe"

output:
  # 默认输出目录
  default_dir: "./outputs"
  # 输出格式列表
  formats:
    - srt
    - json
    - markdown
  # 文件名时间格式
  timestamp_format: "%Y%m%d_%H%M%S"