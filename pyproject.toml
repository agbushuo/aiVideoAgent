[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "videoagent"
version = "0.1.0"
description = "视频 → 字幕 → 总结 → 自动剪辑 Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "openai-whisper>=20231117",
    "torch>=2.0",
    "typer>=0.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "ffmpeg-python>=0.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
]

[project.scripts]
videoagent = "src.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
